<!DOCTYPE html>
<html lang="en">
<head>
    <title>Checkout | PureRadiance</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <style>
        /* ===== GENERAL PAGE STYLE ===== */
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            background: #ffeaf1;
            color: #444;
        }

        header {
            background: #f98fae;
            padding: 15px 0;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            color: white;
            letter-spacing: 1px;
        }

        /* ===== PAYMENT CONTAINER ===== */
        .payment-container {
            max-width: 500px;
            margin: 60px auto;
            background: white;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            text-align: center;
        }

        .payment-container h2 {
            font-size: 28px;
            margin-bottom: 10px;
            color: #e84393;
        }

        .payment-container p {
            font-size: 18px;
            margin-bottom: 25px;
        }

        #payment-total {
            font-weight: bold;
            color: #333;
        }

        /* ===== PAYPAL BUTTON AREA ===== */
        #paypal-button-container {
            margin-top: 20px;
        }

        /* ===== FOOTER ===== */
        footer {
            margin-top: 80px;
            text-align: center;
            padding: 20px;
            color: #666;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <header>PureRadiance Payment</header>

    <div class="payment-container">
        <h2>Secure Checkout</h2>
        <p>Your total: <span id="payment-total">Loading...</span></p>

        <div id="paypal-button-container"></div>
    </div>

    <footer>
        © 2025 PureRadiance Skincare — All Rights Reserved
    </footer>


    <!-- Load PayPal SDK -->
    <script src="https://www.paypal.com/sdk/js?client-id=AVVN5Kric6TM5hRsXmKyYWqcDBHyNzt9exg645ychYaqegl6jTYjjeGSdDoienTAtZ8aJNmL1FqmXKlf&currency=USD"></script>

    <script>
        // Get total from localStorage
        const total = localStorage.getItem("checkout_total") || "$0.00";
        document.getElementById("payment-total").textContent = total;

        const amount = total.replace("$", "");

        paypal.Buttons({
            createOrder: function (data, actions) {
                return actions.order.create({
                    purchase_units: [{
                        amount: { value: amount }
                    }]
                });
            },
            onApprove: function (data, actions) {
                return actions.order.capture().then(function (details) {
                    window.location.href = "payment_success.php?name=" 
                                            + details.payer.name.given_name;
                });
            }
        }).render('#paypal-button-container');
    </script>

</body>
</html>
